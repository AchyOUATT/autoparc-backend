name: Tests

# Sur chaque poussée et chaque pull request : c'est ce qui distingue une suite
# de tests d'un filet de sécurité. Tant qu'ils ne tournent que quand quelqu'un
# tape la commande, une régression attend la prochaine vérification à la main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pdo_sqlite : la suite tourne sur SQLite en mémoire (phpunit.xml).
          #
          # gd : SANS LUI, CINQ TESTS SONT SAUTÉS EN CI, dont tous ceux qui
          # couvrent la génération de variante d'aperçu. C'est la pièce la plus
          # fragile du lot — GD décompresse à quatre octets par pixel, et un
          # dépassement de mémoire en PHP est une erreur FATALE qui tue la
          # requête de dépôt sans message pour l'utilisateur. Le correctif
          # central n'était donc vérifié par aucune exécution automatique : ce
          # n'est pas un confort de développement, c'est l'absence de filet.
          #
          # Le Dockerfile de production l'installe (`docker-php-ext-install gd`)
          # depuis le début ; c'est la CI qui ne suivait pas.
          #
          # MESURE, LES DEUX FOIS AVEC LES PLAFONDS DE L'IMAGE CI-DESSOUS :
          #
          #     sans gd -> 501 tests, 496 passés, 5 sautés
          #     avec gd -> 501 tests, 501 passés, 0 sauté
          #
          # Le triplet écrit ici précédemment — « 481 tests, 476 passés et 5
          # sautés » — ne correspondait à aucune exécution : il mariait le total
          # d'AVANT le lot (481) au nombre de sauts d'APRÈS (5). Les deux lignes
          # ci-dessus sont relevées sur la même révision, à la suite.
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, gd
          # LA MÉMOIRE DE L'IMAGE DE PRODUCTION, et non celle du coureur.
          #
          # Posée sur le php.ini plutôt qu'en `php -d` sur la commande :
          # `artisan test` lance PHPUnit dans un PROCESSUS FILS, qui n'hérite
          # PAS des `-d`. Mesure, un test qui imprime la limite qu'il voit,
          # lancé par `php -d memory_limit=77M artisan test` :
          #
          #     LIMITE VUE PAR LE FILS : 128M
          #
          # La limite ne touchait que le père. Un `-d` ici n'aurait donc rien
          # éprouvé du tout, en en donnant l'apparence.
          #
          # php:8.4-cli ne livre aucun php.ini, et le seul fichier que l'image
          # pose dans conf.d est docker/php/depot-de-photos.ini. Les TROIS
          # valeurs ci-dessous sont donc exactement les siennes — c'était 128M
          # ici tant que ce fichier ne portait pas memory_limit, ce qui n'est
          # plus le cas. Le Dockerfile ne relève la mémoire qu'une seconde fois,
          # à 256M, et uniquement sur `media:apercus` ; le chemin du dépôt de
          # photo garde les 192M, et c'est ce que la CI doit éprouver.
          #
          # Ce sont des directives PHP_INI_PERDIR ou PHP_INI_ALL qu'aucun test ne
          # peut poser pour la requête qui le lit, si bien que ce qu'un dépôt de
          # photo donne dépend entièrement de ce qui est écrit ici. Les laisser
          # aux défauts du coureur ferait éprouver un serveur qui n'existe nulle
          # part — et PlafondsDeDepotTest le dit bruyamment en se sautant. Le
          # calcul de 9M, 24M et 192M est dans docker/php/depot-de-photos.ini.
          ini-values: memory_limit=192M, upload_max_filesize=9M, post_max_size=24M
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # ── CETTE ÉTAPE DOIT PRÉCÉDER `composer install`. NE PAS LA DÉPLACER. ──
      #
      # `composer install` exécute `post-autoload-dump`, donc
      # `php artisan package:discover` (composer.json, scripts), qui DÉMARRE
      # Laravel. Sans fichier `.env`, `APP_ENV` vaut `production` — c'est le
      # défaut de `config/app.php` — et la garde
      # `AppServiceProvider::exigerUneAdressePubliqueAbsolue()` lève alors :
      #
      #     APP_URL est obligatoire en production et doit etre absolue :
      #     valeur lue « http://localhost »
      #
      # `composer install` sort en 1, et le job meurt en une quinzaine de
      # secondes sans avoir lancé un seul test.
      #
      # CE N'EST PAS UNE HYPOTHÈSE. La garde est arrivée le 2026-10-18 avec
      # f4becc8 ; ce workflow copiait le `.env` APRÈS `composer install`, et il
      # a échoué sur les 41 commits suivants — personne ne l'a vu, parce qu'un
      # échec d'installation ressemble à un incident d'infrastructure. Reproduit
      # le 2026-10-25 en écartant `.env` du dépôt et en lançant
      # `php artisan package:discover` : même message, même cause.
      #
      # Avec le `.env` en place, `APP_ENV=local` et la garde s'écarte d'elle-même
      # (`AppServiceProvider:117`). Elle reste donc entière : on ne l'affaiblit
      # pas pour faire passer la CI, on cesse de la déclencher à tort.
      #
      # `key:generate` ne peut PAS remonter ici : il lui faut `vendor/`, donc
      # l'installation. D'où la coupure en deux étapes.
      - name: Poser le fichier d'environnement
        run: cp .env.example .env

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé d'application
        run: php artisan key:generate

      # ── LES ECHECS DOIVENT ETRE LISIBLES SANS OUVRIR LE JOURNAL ──────────
      #
      # `php artisan test` ecrit ses echecs sur la sortie standard, et rien de
      # plus : la page d'une execution rouge n'affiche alors qu'une annotation
      # « Process completed with exit code 1 ». Il faut ouvrir le journal, donc
      # etre connecte avec les droits sur le depot, pour savoir QUEL test est
      # tombe.
      #
      # Mesure le 25/10/2026 : la CI a passe 41 commits en echec sans que
      # personne ne sache pourquoi, precisement parce que le motif ne sortait
      # pas de ce journal. Le diagnostic a coute une reproduction locale de
      # l'environnement du coureur.
      #
      # `--log-junit` est lu par PHPUnit, pas par `artisan test` : la passe-plat
      # est documentee et stable. Chaque `<failure>` ou `<error>` devient un
      # `::error::`, c'est-a-dire une ANNOTATION, visible en haut de la page
      # d'execution sans ouvrir quoi que ce soit.
      #
      # `continue-on-error` serait faux ici : on veut l'annotation ET l'echec du
      # job. D'ou le code de sortie conserve a la main.
      - name: Lancer les tests
        run: |
          set +e
          php artisan test --log-junit=junit.xml
          code=$?
          set -e

          if [ -f junit.xml ]; then
            php -r '
              $x = @simplexml_load_file("junit.xml");
              if ($x === false) { echo "::warning::Rapport JUnit illisible.\n"; exit; }
              $n = 0;
              foreach ($x->xpath("//testcase[failure or error]") ?: [] as $cas) {
                $n++;
                $noeud = $cas->failure ?? $cas->error;
                // Ligne 0 du corps JUnit = le nom du test, deja dans le titre.
                // Ligne 1 = le motif. Les suivantes sont la pile.
                $lignes = array_values(array_filter(array_map("trim", explode("\n", (string) $noeud)), "strlen"));
                $raison = $lignes[1] ?? ($lignes[0] ?? "sans motif");
                // Le premier cadre de pile qui pointe dans le depot, et non
                // dans vendor/ : c est la ligne ou aller regarder.
                $ou = "";
                foreach ($lignes as $l) {
                  if (! str_contains($l, "vendor") && preg_match("#(tests|app|database|routes)[\\\\/][^\s:]+\.php:\d+#", $l, $m)) {
                    $ou = " [" . str_replace("\\", "/", $m[0]) . "]";
                    break;
                  }
                }
                printf("::error::%s — %s%s\n", $cas["name"], substr($raison, 0, 280), $ou);
              }
              printf("::notice::%d test(s) en echec remontes en annotation.\n", $n);
            '
          fi

          exit $code
