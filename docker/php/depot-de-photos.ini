; Les plafonds de dépôt de PHP, posés sur l'image de production.
;
; TROIS directives, et elles ne se choisissent pas séparément :
; upload_max_filesize borne UN fichier, post_max_size borne le corps ENTIER de
; toute requête POST, et memory_limit doit tenir le plus gros corps que
; post_max_size laisse entrer. La rédaction précédente ne posait que les deux
; premières, en écrivant « memory_limit n'est PAS touché [...] Le dépôt n'a pas
; besoin de plus ». C'était faux, et mesurable : voir « CE QUE LE 92M PRÉCÉDENT
; COÛTAIT » plus bas.
;
; ── D'OÙ VIENNENT CES DIRECTIVES : UNE PANNE DE DÉPÔT ──────────────────────
;
; php:8.4-cli n'active aucun php.ini — les deux modèles livrés restent
; php.ini-production et php.ini-development, non copiés — et le Dockerfile
; n'en posait pas. Les défauts COMPILÉS de PHP s'appliquaient donc, et les
; voici, mesurés sans aucun php.ini :
;
;     php -n -r "echo ini_get('upload_max_filesize');" -> 2M
;     php -n -r "echo ini_get('post_max_size');"       -> 8M
;     php -n -r "echo ini_get('memory_limit');"        -> 128M
;     php -n -r "echo ini_get('max_file_uploads');"    -> 20
;
; Le `-n` compte : c'est ce qui distingue le défaut compilé de ce qu'un php.ini
; pose. Le poste de développement, lui, porte ces mêmes valeurs dans son
; php.ini (lignes 851, 699, 435 et 854, dans l'ordre ci-dessus) — heureuse
; coïncidence, car c'est elle qui a permis de reproduire par HTTP réel, sur ce
; poste, le comportement exact de l'image.
;
; Or MediaController::MAX_SIZE vaut 8192 ko et la validation l'annonce. PHP
; refusait le fichier AVANT que Laravel le voie. Mesure par HTTP réel,
; POST /api/parts/1/media, un seul fichier :
;
;     2 072 238 o (juste sous 2 MiB) -> 201
;     2 255 773 o (juste au-dessus)  -> 422 « The photos.0 failed to upload. »
;     6 797 161 o (4000x3000, q85)   -> 422 « The photos.0 failed to upload. »
;
; Une prise de téléphone ordinaire fait 2 à 5 Mo : le vendeur n'arrivait pas à
; envoyer ses photos, et le message ne parlait pas de taille.
;
; ── upload_max_filesize = 9M : POUR QUE LARAVEL REFUSE LE PREMIER ──────────
;
; 9M, soit STRICTEMENT AU-DESSUS de MediaController::MAX_SIZE (8192 ko =
; 8 388 608 o). Ce n'est pas une marge de confort : c'est ce qui fait que
; LARAVEL est toujours celui qui refuse. PHP qui refuse le premier vide le
; fichier et ne laisse qu'un code d'erreur ; Laravel qui refuse rend un message
; qui nomme le dépassement et la limite (voir MediaController::reglePoids et
; refusDePhpSurLaTaille). La limite du produit reste donc 8192 ko, annoncée par
; la validation, et celle-ci ne sert qu'à ne jamais la devancer.
;
; ── post_max_size = 24M : CE QUI EST ENVOYÉ, PAS LE PIRE CAS THÉORIQUE ─────
;
; La rédaction précédente posait 92M, calculés sur 10 x upload_max_filesize,
; c'est-à-dire sur dix fichiers de 9 Mo que personne n'envoie. 24M est calculé
; sur ce qui passe réellement par cette route. Mesures par HTTP réel,
; POST /api/parts/1/media, Content-Length relevé par curl :
;
;     dix x   706 508 o (2048 px, ce que pose le lot mobile) -> 7 066 612 o
;     dix x 2 072 670 o (4,18 Mpx, la prise de téléphone de
;                        référence du lot précédent)         -> 20 728 232 o
;
; L'enveloppe multipart mesurée est de 1 532 o pour dix fichiers sans champ
; supplémentaire. 24M = 25 165 824 o laisse donc 4 437 592 o — 21 % — au-dessus
; du second cas, et 3,6 fois le premier.
;
; CE QUE CELA REFUSE, ET IL FAUT LE DIRE : dix photos de plus de ~2,4 Mo
; chacune. Les versions déjà installées envoient des photos pleines pendant des
; mois, et le plancher de version (AppVersionController) ne les bloque pas
; toutes. Mesures du refus, par HTTP réel sous 24M :
;
;     dix x 6 739 621 o (67 397 742 o) -> 413 « L'envoi pese 64,28 Mo au
;                                         total [...] pas plus de 24 Mo par
;                                         envoi. Envoyez-le en plusieurs
;                                         fois. », 57,73 s
;     dix x 7 931 546 o (79 316 992 o) -> 413, même texte à 75,64 Mo, 77,21 s
;
; Un refus explicite, en français, qui nomme le poids envoyé, la limite et le
; geste à faire — là où les mêmes requêtes rendaient 201 en 55,23 s et 65,80 s
; sous 92M, la seconde en n'écrivant AUCUNE vignette sur dix. Le vendeur envoie
; désormais en deux fois ; c'est une dégradation, assumée contre ce qui suit.
;
; ── CE QUE LE 92M PRÉCÉDENT COÛTAIT, MESURÉ SUR /api/login ─────────────────
;
; post_max_size s'applique à TOUTES les routes POST, pas au seul dépôt de
; photos. Et PHP remplit $_POST au DÉMARRAGE de la requête, avant la première
; ligne de PHP. Mesure du pic mémoire, corps JAMAIS lu par le script,
; post_max_size=200M, relevé par auto_prepend_file :
;
;     json       25 165 824 o -> pic     432 328 o
;     json       94 371 840 o -> pic     432 328 o
;     urlencoded 25 165 820 o -> pic 101 061 632 o
;     urlencoded 94 371 836 o -> pic 377 885 696 o
;
; QUATRE fois le corps pour un urlencoded, imputées au memory_limit sans que le
; code y touche. Avec 92M et memory_limit laissé à 128M, le résultat était
; celui-ci — POST /api/login, route NON AUTHENTIFIÉE, par HTTP réel :
;
;     20 971 520 o json       -> 422,  6,56 s
;     33 554 428 o urlencoded -> 500 AU CORPS VIDE, 15,76 s
;     50 331 648 o json       -> 500 AU CORPS VIDE, 32,79 s
;     94 371 840 o json       -> 500 AU CORPS VIDE, 87,94 s
;
; Un 500 au corps vide, provoqué sans compte, par une erreur fatale de mémoire.
; C'est ce que ce fichier corrige, et c'est pour cela que post_max_size descend
; et que memory_limit monte.
;
; ── memory_limit = 192M : IL EST POSÉ, ET VOICI CE QU'IL LAISSE ────────────
;
; Le pire corps que 24M laisse entrer est un urlencoded de 25 165 824 o, à
; quatre fois son poids. Mesures par HTTP réel sous 9M / 24M / 192M, pic relevé
; par auto_prepend_file :
;
;     POST /api/login,  25 165 820 o urlencoded -> 422, 101 061 632 o, 12,99 s
;     POST /api/login,  20 971 520 o json       -> 422,  70 434 808 o,  9,60 s
;     POST .../media, dix x   706 508 o         -> 201,  49 556 816 o,  8,76 s
;     POST .../media, dix x 2 072 670 o         -> 201,  60 096 872 o, 11,43 s
;     POST .../media,  un x 7 931 546 o (16 Mpx)-> 201, 106 569 680 o,  3,44 s
;
; 192M = 201 326 592 o. Le pire corps mesuré en laisse donc 100 264 960 o, soit
; 95,6 Mo. Le plus gourmand n'est pas le corps mais GD sur une photo de 16 Mpx,
; à 106 569 680 o : il reste 94 756 912 o derrière lui, là où 128M n'en
; auraient laissé que 27 648 048 o. Les pics de VignetteApercu sont relevés à
; 128M et NE DÉPENDENT PAS de la limite : à 16,00 Mpx, une entrée de
; 9 057 386 o donnait 102,0 Mo sous 128M, et une entrée de 7 931 546 o donne
; 102 798 656 o sous 192M. Ce que la limite déplace, c'est le verdict du
; garde-fou, pas le besoin : sur 11 lignes déposées à 7 931 546 o, les 10
; envoyées en une requête sous 128M ont 0 aperçu, la 1 envoyée seule sous 192M
; en a 1.
;
; CE QUE CELA PREND SUR L'INSTANCE. Le plan gratuit de Render a 512 Mo pour
; TOUT, et `php artisan serve` est mono-processus : une seule requête à la
; fois, donc au plus un memory_limit côté web. Le Dockerfile lance en plus, au
; démarrage, `php -d memory_limit=256M artisan media:apercus`. Les deux
; PLAFONDS font 448 Mo sur 512, et c'est le chiffre qui inquiète. Les deux PICS
; mesurés — socle compris, puisque `memory_get_peak_usage` compte tout le
; processus — font 106 569 680 o pour la requête la plus gourmande et
; 102 798 656 o pour une variante de 16 Mpx en console, soit ~200 Mo des
; 512 Mo. La marge est dans les pics, pas dans les plafonds, et un dépassement
; se verrait en OOM de l'instance, pas en 500.
;
; ── CE QUE CE FICHIER NE PEUT PAS CORRIGER ────────────────────────────────
;
; LE TEMPS DE LECTURE. `php artisan serve` lit la requête entière dans le
; tampon de son SAPI avant de la dispatcher, et ce tampon grandit par
; réallocations : le coût est super-linéaire. Mesures, corps urlencoded sur
; /api/login, memory_limit=1024M pour qu'aucun ne meure :
;
;      4 194 300 o ->  1,96 s
;      8 388 604 o ->  2,62 s
;     16 777 212 o ->  5,44 s
;     25 165 820 o -> 10,43 s
;     33 554 428 o -> 15,57 s
;     50 331 644 o -> 34,92 s
;
; Un corps refusé le paie aussi, et la MÉMOIRE, elle, ne dépend plus de sa
; taille — public/index.php le refuse avant `Request::capture()`. Mesures par
; HTTP réel sous 9M / 24M / 192M :
;
;      33 554 428 o urlencoded -> 413, pic 7 911 256 o,  18,53 s
;      50 331 648 o json       -> 413, pic 7 911 216 o,  37,08 s
;      94 371 836 o urlencoded -> 413, pic 7 911 256 o,  79,24 s
;      94 371 840 o json       -> 413, pic 7 911 216 o, 149,69 s
;     201 326 592 o json       -> 413, pic 7 911 216 o, 628,19 s
;
; Le pic est plat — 7,9 Mo du premier au dernier, Laravel n'étant jamais amorcé
; —, le temps non. Aucune directive PHP ne borne ce temps ; seul un vrai serveur
; devant l'application, qui refuserait sur l'en-tête Content-Length sans lire la
; suite, le ferait.
;
; CE QUE CE TEMPS BLOQUE, mesuré et non supposé. La lecture, elle, N'EST PAS
; bloquante : la boucle du serveur intercale les autres requêtes. `GET /up`
; sondé en continu pendant un dépôt de 20 728 232 o a répondu entre 0,25 et
; 0,53 s tout du long, et pendant un corps de 50 331 648 o refusé il a répondu
; en 0,53 s. C'est la PHASE SCRIPT qui sérialise, et une seule sonde par dépôt
; la voit : 5,43 s sur un premier essai, 9,62 s sur un second, contre la même
; base de 0,25 à 0,53 s. Pendant ces secondes-là, personne d'autre n'est servi.
; Le pire corps non-multipart accepté, lui, n'a bloqué aucune sonde au-delà de
; 0,64 s : son temps est en lecture, pas en script. Le pire DÉPÔT accepté, qui
; est le vrai plafond de cette phase, est chiffré dans le Dockerfile au-dessus
; du CMD : 23,85 s de blocage mesurés, contre les 30 s de max_execution_time.
;
; ── max_file_uploads reste au défaut, et c'est délibéré ────────────────────
;
; 20, mesuré plus haut. Le baisser à 10 ferait SILENCIEUSEMENT disparaître les
; fichiers au-delà du dixième — et « sans rien dire » est mesuré, pas supposé.
; Sonde avec max_file_uploads=5, sept fichiers envoyés :
;
;     fichiers recus = 5
;     noms = p1.jpg, p2.jpg, p3.jpg, p4.jpg, p5.jpg
;     erreurs = 0, 0, 0, 0, 0
;
; Aucun code d'erreur par fichier : les deux derniers n'existent tout
; simplement pas, et l'application croirait avoir envoyé cinq photos. La seule
; trace est un avertissement de démarrage, « Maximum number of allowable file
; uploads has been exceeded ». La validation MAX_PHOTOS, elle, rend un 422 qui
; le dit — mesure par HTTP réel sous 24M, onze fichiers de 706 508 o : 422
; « Vous ne pouvez pas envoyer plus de 10 photos a la fois. Envoyez-les en
; plusieurs fois. », en 2,12 s.
upload_max_filesize = 9M
post_max_size = 24M
memory_limit = 192M
