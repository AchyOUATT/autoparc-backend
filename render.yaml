services:
  - type: web
    name: autoparc-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false          # à remplir manuellement avec l'URL Render
      - key: APP_KEY
        sync: false          # à remplir avec la valeur de ton .env local
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: autoparc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autoparc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: autoparc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: autoparc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autoparc-db
          property: password
      - key: FIREBASE_CREDENTIALS
        sync: false          # JSON de ta clé de service Firebase

  # Rappels d'entretien du garage client.
  #
  # Un cron dédié plutôt qu'un `schedule:run` appelé chaque minute : la tâche
  # est quotidienne, un worker permanent serait payé à ne rien faire 1 439
  # minutes sur 1 440. Si d'autres tâches planifiées apparaissent, ajouter un
  # cron par tâche, ou basculer sur un worker `schedule:work`.
  #
  # L'heure est en UTC chez Render : 8 h UTC correspond a 8 h au Burkina Faso,
  # qui est a UTC+0 toute l'annee.
  - type: cron
    name: autoparc-reminders
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "0 8 * * *"
    dockerCommand: php artisan reminders:maintenance
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: autoparc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autoparc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: autoparc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: autoparc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autoparc-db
          property: password
      - key: FIREBASE_CREDENTIALS
        sync: false          # meme cle que le service web : les rappels poussent via FCM

databases:
  - name: autoparc-db
    plan: free
    databaseName: autoparc
    user: autoparc
