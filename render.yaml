services:
  - type: web
    name: autoparc-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

      # Les journaux vont sur la sortie d'erreur, donc dans le visualiseur de
      # Render. Le canal par défaut (`stack` → `single`) écrit dans
      # storage/logs/laravel.log, à l'intérieur d'un conteneur éphémère que le
      # plan gratuit n'ouvre pas : le fichier était illisible et disparaissait
      # au déploiement suivant.
      #
      # Sans cela, le `report => true` posé sur le disque s3 de
      # config/filesystems.php ne servirait à rien — et c'est précisément
      # l'absence de trace qui a laissé une panne de dépôt de photos passer
      # pour un succès pendant des jours.
      - key: LOG_CHANNEL
        value: stderr

      # APP_URL est OBLIGATOIRE, et ne l'était pas avant les pages de partage.
      #
      # Ces pages composent leur propre adresse depuis cette valeur : og:url,
      # <link rel="canonical">, et le lien WhatsApp pré-rempli que le visiteur
      # renvoie. Elle ne peut pas être lue dans la requête — url()->current()
      # suivait X-Forwarded-Host, auquel trustProxies(at: '*') fait confiance,
      # et un en-tête fourni par le client plaçait donc l'adresse de son choix
      # dans l'aperçu : mesure, « X-Forwarded-Host: pharmacie-cadeaux.example »
      # sur GET /v/1 rendait og:url vers ce domaine, lien WhatsApp compris.
      #
      # À RENSEIGNER AVANT LE PREMIER DÉPLOIEMENT, pas après.
      #
      # Ce commentaire affirmait le contraire de la mesure. Il disait : « non
      # renseignée, Laravel vaut http://localhost, donc l'oubli se voit au
      # premier lien collé ». Un champ `sync: false` laissé blanc dans le
      # tableau de bord n'est pas absent : Render le transmet DÉFINI ET VIDE,
      # et le défaut du second argument d'env() ne couvre que l'absence.
      #
      # Mesure, serveur démarré avec APP_URL= :
      #
      #     config('app.url') -> ''      (var_export : '')
      #     HTTP 200
      #     <meta property="og:url" content="/v/1">
      #     <link rel="canonical" href="/v/1">
      #     <meta property="og:image" content="/storage/vehicles/1/photo.jpg">
      #     lien WhatsApp = https://wa.me/226...?text=...%0A%2Fv%2F1
      #
      # Rien ne se voyait : la page rendait 200, paraissait normale, n'écrivait
      # dans aucun journal, et sa vignette était morte pour toujours.
      #
      # Deux corrections tiennent désormais ce cas. config/app.php se replie par
      # `?:` au lieu du défaut d'env(), et
      # AppServiceProvider::exigerUneAdressePubliqueAbsolue() REFUSE de démarrer
      # en production sur une adresse vide, relative ou locale : le
      # `php artisan config:cache` du Dockerfile échoue, Render garde la version
      # précédente en ligne et affiche le message dans son visualiseur. Un oubli
      # coûte donc un déploiement refusé, et non un catalogue d'aperçus muets.
      #
      # Elle sert aussi d'URL publique au disque `public` de
      # config/filesystems.php, donc aux photos tant que MEDIA_DISK vaut
      # `public`.
      - key: APP_URL
        sync: false          # OBLIGATOIRE avant le 1er déploiement : l'URL Render du service, sans / final
      - key: APP_KEY
        sync: false          # à remplir avec la valeur de ton .env local
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: autoparc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autoparc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: autoparc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: autoparc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autoparc-db
          property: password
      - key: FIREBASE_CREDENTIALS
        sync: false          # JSON de ta clé de service Firebase
      - key: TASKS_SECRET
        # Secret partagé du déclencheur de tâches planifiées, appelé par GitHub
        # Actions. La même valeur doit être posée dans les secrets du dépôt.
        # Non défini, la route refuse tout — c'est voulu : un oubli doit fermer
        # la porte, pas l'ouvrir.
        generateValue: true

      # ── Plancher de version de l'application mobile ─────────────────
      #
      # Au-dessous de MOBILE_MIN_VERSION_CODE, l'application exige la mise à
      # jour. Tout l'intérêt de ces clés est d'être `sync: false` : on relève
      # le plancher depuis le tableau de bord de Render, sans reconstruire
      # l'image ni republier quoi que ce soit — et sans attendre le délai de
      # propagation de Play, qui se compte en heures.
      #
      # Non renseignées, elles valent 0 et ne bloquent personne : un
      # déploiement neuf ne doit pas mettre tout le parc à l'arrêt.
      #
      # Le texte affiché, lui, se pose au besoin en ajoutant
      # MOBILE_UPDATE_MESSAGE depuis le tableau de bord : il explique POURQUOI
      # la mise à jour est exigée, et il vient du serveur et non de
      # l'application — qui, par construction, ne sera plus mise à jour chez
      # ceux à qui le message s'adresse. Non renseigné, config/mobile.php sert
      # une formulation française générique.
      - key: MOBILE_MIN_VERSION_CODE
        sync: false          # versionCode plancher ; 0 ou absent = personne n'est bloqué
      - key: MOBILE_LATEST_VERSION_CODE
        sync: false          # versionCode de la dernière version publiée sur Play
      - key: MOBILE_STORE_URL
        sync: false          # fiche Play ; défaut : bf.autoparc.app

      # ── Interrupteur de l'espace partenaire ─────────────────────────
      #
      # NE PAS METTRE À `true` AVANT D'AVOIR FAIT LES DEUX ÉTAPES CI-DESSOUS.
      # Absent ou vide, l'espace est FERMÉ, et c'est l'état voulu au premier
      # déploiement. Le raisonnement complet est dans config/partenaires.php.
      #
      # Deux choses cassent si l'on ouvre trop tôt :
      #   — personne ne peut APPROUVER un partenaire, l'écran de validation
      #     n'étant dans aucun binaire publié. Les inscriptions resteraient
      #     « pending » indéfiniment ;
      #   — la première annonce partenaire rendue publique casse l'onglet
      #     catalogue de l'application déjà publiée, qui lit `reference` en
      #     cast dur alors que la rédaction le retire.
      #
      # Donc, dans cet ordre : (1) publier une version mobile portant les deux
      # correctifs de lecture et l'écran de validation ; (2) relever
      # MOBILE_MIN_VERSION_CODE à cette version ; (3) seulement alors, ouvrir
      # ici. Comme `config:cache` tourne au DÉMARRAGE du conteneur et non à la
      # construction, changer cette clé suffit — aucune reconstruction.
      - key: PARTNER_SPACE_OPEN
        sync: false          # `true` ouvre l'espace partenaire ; absent = fermé

      # ── Coordonnées de la boutique ──────────────────────────────────
      #
      # Affichées sur les pages de partage d'un article (/v, /p, /a), lues par
      # des gens qui n'ont pas l'application : bouton WhatsApp et bouton
      # d'appel.
      #
      # VALEURS INITIALES SEULEMENT, et c'est le piège de ce bloc.
      #
      # Dès le PREMIER enregistrement dans « Paramètres · Contact AutoParc »
      # (dans l'application, rôles admin et manager), le numéro conservé en
      # base devient la source unique du web ET du mobile, et ces deux clés ne
      # sont plus lues du tout — voir app/Services/AutoParcContact.php et
      # docs/contact-autoparc.md.
      #
      # Les changer ensuite N'A AUCUN EFFET : pas d'erreur, pas de ligne de
      # journal, et la page /v/86 continue d'afficher l'ancien numéro. Le plan
      # gratuit n'ouvre pas de Shell pour aller voir la table, donc rien
      # n'explique le silence. Le numéro se corrige AU BACK-OFFICE, pas ici.
      #
      # Il n'existe aucun chemin de retour vers ces clés : aucune route ne
      # supprime le réglage. Y revenir demanderait d'effacer la ligne
      # `contact_phone` de `app_settings`, donc un accès à la base.
      #
      # `sync: false` pour la même raison que le plancher de version. Non
      # renseignées, config/boutique.php sert les coordonnées en service — et
      # si la valeur posée ici n'est pas composable, l'API sert un dernier
      # recours en le journalisant, plutôt qu'un numéro que l'application
      # refuse de lire.
      - key: BOUTIQUE_TELEPHONE
        sync: false          # forme internationale du lien tel: ; défaut : +22675570484
      - key: BOUTIQUE_WHATSAPP
        sync: false          # format wa.me : indicatif collé, sans « + » ni espaces
      - key: BOUTIQUE_NOM
        sync: false          # nom affiché dans l'aperçu (og:site_name) ; défaut : AutoParc

      # ── Stockage des photos ─────────────────────────────────────────
      #
      # Le disque de Render est éphémère : tout fichier écrit sur place
      # disparaît au déploiement suivant, et une migration de données en
      # déclenche un. Des photos chargées dans storage/app/public seraient
      # effacées à la mise à jour d'après, en laissant des lignes `media`
      # qui pointent sur des fichiers absents.
      #
      # Elles vont donc sur un stockage objet compatible S3 (Cloudflare R2).
      # Tant que ces variables ne sont pas remplies, MEDIA_DISK doit rester
      # à `public` : les photos ne survivront pas, mais rien ne plantera.
      #
      # Procédure complète : docs/stockage-images.md
      - key: MEDIA_DISK
        sync: false          # `s3` une fois le stockage objet configuré
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto          # R2 n'a pas de région au sens d'AWS
      - key: AWS_ENDPOINT
        sync: false          # https://<ID de compte>.r2.cloudflarestorage.com
      - key: AWS_URL
        sync: false          # l'adresse publique qui sert les images
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true          # R2 adresse les compartiments par le chemin

      # ── Rattrapage des aperçus d'images ─────────────────────────────
      #
      # Combien de media `media:apercus` traite à chaque démarrage. La commande
      # fabrique la variante 1200x630 que og:image sert ; sans elle, tout
      # article déjà en base garde son original, que WhatsApp refuse dès
      # quelques centaines de ko — donc pas de vignette, pour tout le catalogue
      # actuel.
      #
      # « de 2 à 6 Mo » figurait ici et était impossible : PHP plafonnait le
      # dépôt à 2M faute de php.ini dans l'image (mesure par HTTP réel,
      # 2 255 773 o -> 422). Le stock à rattraper pèse au plus 2 Mo par photo.
      #
      # Le Dockerfile la lance APRÈS le démarrage et hors de la chaîne
      # bloquante : le détail et les mesures sont commentés là-bas, avec le
      # poids d'entrée qui détermine chaque pic — sans lui un pic ne veut rien
      # dire. Deux chiffres ont déjà été faux ici : 104 Mo d'abord, puis 82,0 Mo
      # sans son entrée. Mesure, 4032x3024 pour une entrée de 6 901 583 o,
      # relevée sous une limite de 128M : pic 88,0 Mo, 0,761 s. Ce pic ne dépend
      # pas de la limite — docker/php/depot-de-photos.ini pose 192M depuis, et
      # la commande garde son `-d memory_limit=256M` ; c'est le verdict du
      # garde-fou que la limite déplace, pas le besoin.
      #
      # Non renseignée, 60 — soit ~40 s de travail à la cadence mesurée sur le
      # poste de développement, et davantage en ligne. Relever ce chiffre ici
      # suffit à solder un stock plus gros, puisque modifier la valeur
      # redéploie. C'est la seule façon d'y arriver sans Shell, que le plan
      # gratuit n'offre pas.
      #
      # « Chaque démarrage reprend où le précédent s'est arrêté » : c'est vrai
      # DEPUIS que les échecs sont marqués. Auparavant, une ligne irréparable
      # sur un petit identifiant — ce que le disque éphémère décrit plus bas
      # fabrique — reprenait tout le budget de chaque démarrage, et trois
      # démarrages d'affilée ne généraient rien. Voir GenererApercusMedia.
      - key: MEDIA_APERCUS_LIMIT
        sync: false          # media traités par démarrage ; défaut 60

      # ── Cotes de consommation officielles ───────────────────────────
      #
      # Au bout de combien de jours `catalog:import-consommations` retélécharge
      # le jeu de Ressources naturelles Canada. La table `motorisations` est
      # vide en production depuis toujours — aucun seeder, aucune migration de
      # données, un seul écrivain, cette commande, qui n'avait jamais tourné en
      # ligne. Toute la chaîne d'affichage (CotesOfficielles, VehicleResource,
      # le widget _ConsommationOfficielle) attend cette donnée et affiche
      # « Côte constructeur inconnue » sans elle.
      #
      # Le Dockerfile la lance en arrière-plan, après que `/up` répond, dans le
      # même bloc que les aperçus et APRÈS eux : les détails et les mesures
      # sont commentés là-bas.
      #
      # Pourquoi un âge plutôt qu'un « n'importer que si la table est vide » :
      # le second fige le référentiel pour toujours, alors que la source
      # republie chaque millésime, et prend un import interrompu entre deux des
      # quatre fichiers pour un import fait.
      #
      # Non renseignée, 180 — la source publie une fois l'an, deux passages par
      # an suffisent. Mesure sur base jetable portant le référentiel complet :
      # 161,8 s, pic 90 177 536 o, 29 187 motorisations écrites, 135
      # générations sur 248 couvertes, 90 noms de modèles sur 174.
      #
      # 0 FORCE L'IMPORT au démarrage suivant — aucune ligne n'est plus récente
      # que « maintenant moins zéro jour » —, et modifier la valeur ici
      # redéclenche justement un démarrage. C'est la seule façon de forcer une
      # reprise sans Shell, que le plan gratuit n'offre pas. À REMETTRE À 180
      # ENSUITE : laissée à 0, chaque réveil de l'instance retéléchargerait les
      # quatre fichiers.
      - key: CATALOG_CONSO_JOURS
        sync: false          # âge au-delà duquel les cotes sont réimportées ; défaut 180, 0 force

  # Les rappels d'entretien ne sont PLUS ici.
  #
  # Ce fichier declarait un service `type: cron` avec `plan: free`. Render
  # n'offre aucun plan gratuit pour les taches cron — leur documentation annonce
  # un minimum d'un dollar par mois et par service. Le service n'a donc jamais
  # pu exister, et c'est le pire de l'affaire : le fichier decrivait une tache
  # quotidienne, personne n'avait de raison d'en douter, et aucun rappel n'est
  # jamais parti pendant que des visites techniques etaient depassees depuis des
  # semaines. Une declaration qui ment coute plus cher qu'une absence.
  #
  # L'ordonnanceur vit desormais dans .github/workflows/reminders.yml : il
  # appelle POST /api/tasks/reminders, garde par le secret TASKS_SECRET. Gratuit,
  # et surtout observable — chaque execution laisse une trace datee.
  #
  # Pour revenir a un cron Render, il faudra retirer `plan: free` et accepter la
  # facturation : la commande `reminders:maintenance` n'a pas bouge.

databases:
  - name: autoparc-db
    plan: free
    databaseName: autoparc
    user: autoparc
