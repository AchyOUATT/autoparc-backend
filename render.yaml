services:
  - type: web
    name: autoparc-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false          # à remplir manuellement avec l'URL Render
      - key: APP_KEY
        sync: false          # à remplir avec la valeur de ton .env local
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: autoparc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autoparc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: autoparc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: autoparc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autoparc-db
          property: password
      - key: FIREBASE_CREDENTIALS
        sync: false          # JSON de ta clé de service Firebase
      - key: TASKS_SECRET
        # Secret partagé du déclencheur de tâches planifiées, appelé par GitHub
        # Actions. La même valeur doit être posée dans les secrets du dépôt.
        # Non défini, la route refuse tout — c'est voulu : un oubli doit fermer
        # la porte, pas l'ouvrir.
        generateValue: true

  # Les rappels d'entretien ne sont PLUS ici.
  #
  # Ce fichier declarait un service `type: cron` avec `plan: free`. Render
  # n'offre aucun plan gratuit pour les taches cron — leur documentation annonce
  # un minimum d'un dollar par mois et par service. Le service n'a donc jamais
  # pu exister, et c'est le pire de l'affaire : le fichier decrivait une tache
  # quotidienne, personne n'avait de raison d'en douter, et aucun rappel n'est
  # jamais parti pendant que des visites techniques etaient depassees depuis des
  # semaines. Une declaration qui ment coute plus cher qu'une absence.
  #
  # L'ordonnanceur vit desormais dans .github/workflows/reminders.yml : il
  # appelle POST /api/tasks/reminders, garde par le secret TASKS_SECRET. Gratuit,
  # et surtout observable — chaque execution laisse une trace datee.
  #
  # Pour revenir a un cron Render, il faudra retirer `plan: free` et accepter la
  # facturation : la commande `reminders:maintenance` n'a pas bouge.

databases:
  - name: autoparc-db
    plan: free
    databaseName: autoparc
    user: autoparc
